    <style>
        body {

            /*background: #111;*/

        .computer-bg {
            /* Take the image out of the layout entirely */

            /* Lock the scale so the bezel hole matches your game's physical canvas size */
            width: 2116px;
            margin-left: 90px;
            margin-top: 560px;
            z-index: -1;          /* Push behind the game */
            pointer-events: none; /* Let mouse clicks pass through */
        }

        #canvas {
            /*margin-left: 200px;*/
            border: none;
            /*display: block;*/
            box-shadow: 0px 0px 20px rgba(1, 0, 0, 0.5);
            /* No CSS stretching and no relative wrappers here */
        }
    </style>

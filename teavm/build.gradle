import org.teavm.gradle.api.OptimizationLevel

plugins {
  id 'java'
  id("com.github.xpenatan.gdx-teavm") version "$gdxTeaVMVersion"
}

eclipse.project.name = appName + "-teavm"

// This must be at least 17, and no lower than the JDK version this project is built with.
java.targetCompatibility = "25"
// This should probably be equal to targetCompatibility, above. This only affects the TeaVM module.
java.sourceCompatibility = "25"

dependencies {
  implementation "com.github.xpenatan.gdx-teavm:backend-web:$gdxTeaVMVersion"
  implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-web:$gdxTeaVMVersion"
  implementation project(':core')
  implementation "com.github.xpenatan.jImGui:imgui-web:$jImGuiVersion"
  implementation "com.github.xpenatan.jImGui:imgui-web_wasm:$jImGuiVersion"
}

/// The tasks set up for debugging are gdx_teavm_web_js_build and gdx_teavm_web_js_run .
/// These auto-build and reload changed sources; they don't obfuscate their output.
/// The tasks for releases are gdx_teavm_web_js_release_build, gdx_teavm_web_js_release_run,
/// gdx_teavm_web_wasm_release_build, and gdx_teavm_web_wasm_release_run .
/// The build tasks will place a build in build/dist/js/release/webapp or build/dist/wasm/release/webapp .
/// The run tasks (including debug) will provide a link to click in the build output.
/// The run tasks won't end on their own; you can open the link multiple times until you stop the build.

gdxTeaVM {
  assets.from(rootProject.files('assets'))
  classpathAssets("com/kotcrab/vis/ui/skin")

  /// You can add additional classes or packages that need reflection here.
  reflection.add("com.kotcrab.vis.ui.widget")
  reflection.add("com.kotcrab.vis.ui.widget.spinner")
  reflection.add("com.kotcrab.vis.ui.widget.dialog")
  reflection.add("com.kotcrab.vis.ui.widget.color")
  reflection.add("com.kotcrab.vis.ui.widget.tabbedpane")
  reflection.add("com.kotcrab.vis.ui.widget.toast")
  reflection.add("com.kotcrab.vis.ui.util.form")
  reflection.add("com.kotcrab.vis.ui.Sizes")
  reflection.add("com.kotcrab.vis.ui.util.adapter.SimpleListAdapter")
  reflection.add("com.kotcrab.vis.ui.**Style")

  webDefaults {
    mainClass.set("lando.systems.ld60.teavm.TeaVMLauncher")
    htmlTitle.set(appName)
  }

  js {
    devServer {
      enabled.set(true)
      autoBuild.set(true)
      autoReload.set(true)
      optimization.set(OptimizationLevel.NONE)
    }
  }

  js("release") {
    obfuscated.set(true)
    serverPort.set(8180)
    optimization.set(OptimizationLevel.BALANCED)
  }

  wasm("release") {
    obfuscated.set(true)
    serverPort.set(8181)
    optimization.set(OptimizationLevel.BALANCED)
  }
}

// For backwards compatibility with the earlier run and build tasks.
tasks.register("run"){
  dependsOn("gdx_teavm_web_wasm_release_run")
}
build.dependsOn("gdx_teavm_web_wasm_release_build")


// 1. Define the JS and WASM specific scripts
def jsScripts = """
        <script>
            async function start() {
                main()
            }
            window.addEventListener("load", start);
        </script>
        <script type="text/javascript" charset="utf-8" src="app.js"></script>
"""

def wasmScripts = """
        <script>
            async function start() {
                let teavm = await TeaVM.wasmGC.load("app.wasm"); teavm.exports.main([]);
            }
            window.addEventListener("load", start);
        </script>
        <script type="text/javascript" charset="utf-8" src="app.wasm-runtime.js"></script>
"""

// 2. Overwrite the JS Release HTML
tasks.matching { it.name == "gdx_teavm_web_js_release_build" }.configureEach {
  doLast {
    def templateFile = file("webapp/index_template.html")
    def outDir = file("build/dist/js/release/webapp")
    def outputFile = file("${outDir}/index.html")
    if (templateFile.exists()) {
      outputFile.text = templateFile.text.replace('<!-- TEAVM_SCRIPTS -->', jsScripts)
    }
    project.copy {
      from file("webapp/static")
      into outDir
    }
  }
}

// 3. Overwrite the WASM Release HTML
tasks.matching { it.name == "gdx_teavm_web_wasm_release_build" }.configureEach {
  doLast {
    def templateFile = file("webapp/index_template.html")
    def outDir = file("build/dist/wasm/release/webapp")

    def outputFile = file("${outDir}/index.html")
    if (templateFile.exists()) {
      outputFile.text = templateFile.text.replace('<!-- TEAVM_SCRIPTS -->', wasmScripts)
    }

    project.copy {
      from file("webapp/static")
      into outDir
    }
  }
}

// 4. Overwrite the Dev Server (JS Debug) HTML so testing matches release
tasks.matching { it.name == "gdx_teavm_web_js_build" }.configureEach {
  doLast {
    def templateFile = file("webapp/index_template.html")
    // Note: The debug path lacks the "release/" subfolder
    def outDir = file("build/dist/js/webapp")
    def outputFile = file("${outDir}/index.html")
    if (templateFile.exists()) {
      outputFile.text = templateFile.text.replace('<!-- TEAVM_SCRIPTS -->', jsScripts)
    }

    project.copy {
      from file("webapp/static")
      into outDir
    }
  }
}
